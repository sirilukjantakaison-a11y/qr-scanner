<!DOCTYPE html>
<html lang="th">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>QR Scanner - เบิกวัสดุ</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h2 {
      margin-bottom: 10px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-sizing: border-box;
    }

    #result {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin: 15px auto;
      max-width: 450px;
      font-size: 18px;
      font-weight: bold;
      white-space: pre-line;
    }

    button {
      font-size: 17px;
      padding: 12px 20px;
      margin: 5px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    #startBtn {
      background: #1a73e8;
      color: white;
    }

    #stopBtn {
      background: #777;
      color: white;
    }

  </style>

</head>


<body>

  <h2>📦 สแกน QR วัสดุ</h2>

  <div id="reader"></div>

  <div id="result">
    พร้อมสแกน
  </div>

  <button
    id="startBtn"
    onclick="startScanner()"
  >
    📷 เริ่มสแกน
  </button>

  <button
    id="stopBtn"
    onclick="stopScanner()"
  >
    หยุดสแกน
  </button>


<script>

let scanner = null;


/*
 * Google Apps Script Web App
 */
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwOiLFnz_7z0F1USR4qcV3_oBmcd2VRHJJ5B5xVP2qBWAznWv62QC14tbql1FIZuRS9bA/exec";


/*
 * ==========================================
 * เริ่มสแกน
 * ==========================================
 */

function startScanner() {

  document.getElementById("result").innerText =
    "กำลังเปิดกล้อง...";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      /*
       * หยุดกล้อง
       */

      stopScanner();


      /*
       * แสดง Item Code
       */

      document.getElementById("result").innerText =
        "📦 Item Code: " +
        decodedText +
        "\nกำลังบันทึก...";


      /*
       * ส่งข้อมูล
       */

      sendItemCode(decodedText);

    },

    function(errorMessage) {

      /*
       * ไม่ต้องแสดง Error
       * ระหว่างค้นหา QR
       */

    }

  )

  .catch(function(error) {

    document.getElementById("result").innerText =
      "❌ ไม่สามารถเปิดกล้องได้\n" +
      error;

  });

}


/*
 * ==========================================
 * หยุดสแกน
 * ==========================================
 */

function stopScanner() {

  if (!scanner) {
    return;
  }


  scanner
    .stop()

    .then(function() {

      scanner.clear();

      scanner = null;

    })

    .catch(function() {

      scanner = null;

    });

}


/*
 * ==========================================
 * ส่ง Item Code
 * JSONP
 * ==========================================
 */

function sendItemCode(itemCode) {


  /*
   * สร้างชื่อ Callback
   */

  const callbackName =
    "qrCallback_" +
    Date.now();


  /*
   * สร้าง Script
   */

  const script =
    document.createElement("script");


  /*
   * Callback
   */

  window[callbackName] =
    function(data) {


      if (data.success) {

        document.getElementById("result").innerText =
          "✅ " +
          data.message;

      }

      else {

        document.getElementById("result").innerText =
          "❌ " +
          data.message;

      }


      /*
       * ล้าง Script
       */

      delete window[callbackName];

      script.remove();

    };


  /*
   * สร้าง URL
   */

  const url =
    SCRIPT_URL +
    "?action=scan" +
    "&itemCode=" +
    encodeURIComponent(itemCode) +
    "&callback=" +
    callbackName;


  /*
   * เรียก Apps Script
   */

  script.src = url;


  /*
   * ถ้าเชื่อมต่อไม่ได้
   */

  script.onerror =
    function() {

      document.getElementById("result").innerText =
        "❌ ส่งข้อมูลไป Google Sheet ไม่สำเร็จ";

      delete window[callbackName];

      script.remove();

    };


  /*
   * ส่งคำขอ
   */

  document.body.appendChild(script);

}

</script>

</body>
</html>

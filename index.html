<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>ระบบใบเบิกวัสดุ QR</title>

  <!-- QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h3 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 11px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    #startBtn {
      background: #1a73e8;
      color: white;
    }

    #stopBtn {
      background: #666;
      color: white;
    }

    #searchBtn {
      background: #555;
      color: white;
    }

    #addBtn {
      background: #188038;
      color: white;
      font-weight: bold;
    }

    #saveBtn {
      background: #0b8043;
      color: white;
      font-weight: bold;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #status {
      text-align: center;
      padding: 10px;
      font-weight: bold;
      white-space: pre-line;
    }

    .item-info {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      display: none;
    }

    .item-info div {
      margin: 5px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th,
    td {
      border-bottom: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f5f5f5;
    }

    .qty {
      width: 70px;
      padding: 7px;
    }

    .delete {
      background: #d93025;
      color: white;
      padding: 7px;
      width: auto;
      margin: 0;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

  </style>

</head>

<body>

<div class="container">

  <h2>📦 ระบบใบเบิกวัสดุ QR</h2>

  <div class="subtitle">
    ใบเบิกวัสดุหลายรายการ
  </div>


  <!-- ข้อมูลผู้เบิก -->

  <div class="card">

    <h3>👤 ข้อมูลผู้เบิก</h3>

    <label>Employee</label>

    <input
      id="employee"
      type="text"
      placeholder="ชื่อผู้เบิก"
    >


    <label>Emp. ID</label>

    <input
      id="empId"
      type="text"
      placeholder="รหัสพนักงาน"
    >


    <label>Department</label>

    <input
      id="department"
      type="text"
      placeholder="แผนก"
    >


    <label>Station</label>

    <input
      id="station"
      type="text"
      placeholder="Station"
    >


    <label>Model</label>

    <input
      id="model"
      type="text"
      placeholder="Model"
    >


    <label>Used for</label>

    <input
      id="usedFor"
      type="text"
      placeholder="ใช้สำหรับ"
    >

  </div>


  <!-- Scanner -->

  <div class="card">

    <h3>📷 สแกนวัสดุ</h3>

    <button
      id="startBtn"
      onclick="startScanner()"
    >
      📷 สแกน QR Code
    </button>

    <button
      id="stopBtn"
      onclick="stopScanner()"
    >
      หยุดกล้อง
    </button>

    <div id="reader"></div>

    <div id="status">
      พร้อมสแกน
    </div>

  </div>


  <!-- ค้นหา Item -->

  <div class="card">

    <h3>🔎 ค้นหา Item</h3>

    <input
      id="itemCodeInput"
      type="text"
      placeholder="กรอก Item Code เช่น 07-MGEL-0005"
    >

    <button
      id="searchBtn"
      onclick="searchItem()"
    >
      🔍 ค้นหา Item
    </button>


    <div
      id="itemInfo"
      class="item-info"
    >

      <div>
        <b>Item Code:</b>
        <span id="infoCode"></span>
      </div>

      <div>
        <b>Item Name:</b>
        <span id="infoName"></span>
      </div>

      <div>
        <b>Description:</b>
        <span id="infoDescription"></span>
      </div>

      <div>
        <b>Unit:</b>
        <span id="infoUnit"></span>
      </div>

      <div>
        <b>Location:</b>
        <span id="infoLocation"></span>
      </div>

    </div>


    <label>จำนวน</label>

    <input
      id="itemQty"
      class="qty"
      type="number"
      min="1"
      value="1"
    >

    <button
      id="addBtn"
      onclick="addCurrentItem()"
    >
      ➕ เพิ่มรายการ
    </button>

  </div>


  <!-- รายการ -->

  <div class="card">

    <h3>📋 รายการที่ต้องการเบิก</h3>

    <table>

      <thead>

        <tr>

          <th>#</th>
          <th>Item Code</th>
          <th>Item Name</th>
          <th>Unit</th>
          <th>Qty</th>
          <th></th>

        </tr>

      </thead>

      <tbody id="itemTable">

        <tr>

          <td
            colspan="6"
            class="empty"
          >
            ยังไม่มีรายการ
          </td>

        </tr>

      </tbody>

    </table>

  </div>


  <!-- บันทึก -->

  <div class="card">

    <button
      id="saveBtn"
      onclick="saveRequest()"
    >
      ✅ ยืนยันการเบิก
    </button>

  </div>

</div>


<script>

/*************************************************
 * CONFIG
 *************************************************/

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwIfc0j5P1mygdu4BiHOdZOej7PI5LI2Uu8PYHLDhD1sp9NGj1Xyqn9WhTaB1pTYeZFRg/exec";


let scanner = null;

let scanning = false;

let currentItem = null;

let items = [];


/*************************************************
 * STATUS
 *************************************************/

function setStatus(message) {

  document.getElementById("status")
    .innerText = message;

}


/*************************************************
 * START SCANNER
 *************************************************/

async function startScanner() {

  if (scanning) {
    return;
  }


  setStatus("กำลังเปิดกล้อง...");


  try {

    scanner =
      new Html5Qrcode("reader");


    const cameras =
      await Html5Qrcode.getCameras();


    if (!cameras || cameras.length === 0) {

      throw new Error(
        "ไม่พบกล้องในอุปกรณ์"
      );

    }


    let cameraId =
      cameras[0].id;


    /*
     * เลือกกล้องหลัง
     */
    const backCamera =
      cameras.find(function(camera) {

        const label =
          String(camera.label || "")
            .toLowerCase();

        return (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        );

      });


    if (backCamera) {

      cameraId =
        backCamera.id;

    }


    scanning = true;


    await scanner.start(

      cameraId,

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      function(decodedText) {

        handleQRCode(decodedText);

      },

      function() {

        /*
         * ไม่แสดง error
         * ระหว่างค้นหา QR
         */

      }

    );


    setStatus(
      "📷 กล้องพร้อม\nนำ QR Code มาไว้ในกรอบ"
    );

  }

  catch (error) {

    console.error(error);

    scanning = false;

    scanner = null;

    setStatus(
      "❌ ไม่สามารถเปิดกล้องได้\n" +
      "กรุณาตรวจสอบสิทธิ์กล้องของ Browser"
    );

  }

}


/*************************************************
 * STOP SCANNER
 *************************************************/

async function stopScanner() {

  if (!scanner) {

    scanning = false;

    return;

  }


  try {

    if (scanning) {

      await scanner.stop();

    }

  }

  catch (error) {

    console.log(error);

  }


  try {

    scanner.clear();

  }

  catch (error) {

    console.log(error);

  }


  scanner = null;

  scanning = false;

}


/*************************************************
 * QR CODE
 *************************************************/

async function handleQRCode(decodedText) {

  const code =
    String(decodedText || "").trim();


  if (!code) {
    return;
  }


  await stopScanner();


  document.getElementById(
    "itemCodeInput"
  ).value = code;


  setStatus(
    "✅ อ่าน QR สำเร็จ\n" +
    "Item Code: " +
    code +
    "\nกำลังค้นหาข้อมูล..."
  );


  searchItem(code);

}


/*************************************************
 * SEARCH ITEM
 *************************************************/

function searchItem(codeFromQR) {

  const code =
    codeFromQR ||
    document.getElementById(
      "itemCodeInput"
    ).value.trim();


  if (!code) {

    setStatus(
      "กรุณากรอก Item Code"
    );

    return;

  }


  currentItem = null;


  document.getElementById(
    "itemInfo"
  ).style.display = "none";


  setStatus(
    "⏳ กำลังเชื่อมต่อ Apps Script..."
  );


  const url =
    SCRIPT_URL +
    "?action=item" +
    "&itemCode=" +
    encodeURIComponent(code) +
    "&t=" +
    Date.now();


  fetch(url, {
    method: "GET",
    cache: "no-store"
  })

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    return response.json();

  })

  .then(function(data) {

    if (!data.success) {

      setStatus(
        "❌ " +
        (data.message ||
        "ไม่พบข้อมูล Item")
      );

      return;

    }


    currentItem =
      data.item;


    showItem(currentItem);


    setStatus(
      "✅ พบ Item\n" +
      currentItem.itemCode
    );

  })

  .catch(function(error) {

    console.error(error);


    setStatus(
      "❌ เชื่อมต่อ Apps Script ไม่สำเร็จ\n" +
      "กรุณาตรวจสอบ Web App และสิทธิ์การเข้าถึง"
    );

  });

}


/*************************************************
 * SHOW ITEM
 *************************************************/

function showItem(item) {

  document.getElementById(
    "infoCode"
  ).innerText =
    item.itemCode || "";


  document.getElementById(
    "infoName"
  ).innerText =
    item.itemName || "";


  document.getElementById(
    "infoDescription"
  ).innerText =
    item.description || "";


  document.getElementById(
    "infoUnit"
  ).innerText =
    item.unit || "";


  document.getElementById(
    "infoLocation"
  ).innerText =
    item.location || "";


  document.getElementById(
    "itemInfo"
  ).style.display =
    "block";

}


/*************************************************
 * ADD ITEM
 *************************************************/

function addCurrentItem() {

  if (!currentItem) {

    alert(
      "กรุณาสแกน QR หรือค้นหา Item ก่อน"
    );

    return;

  }


  const qty =
    Number(
      document.getElementById(
        "itemQty"
      ).value
    );


  if (!qty || qty <= 0) {

    alert(
      "กรุณาระบุจำนวนให้ถูกต้อง"
    );

    return;

  }


  const existing =
    items.find(function(item) {

      return (
        item.itemCode ===
        currentItem.itemCode
      );

    });


  if (existing) {

    existing.qty += qty;

  }

  else {

    items.push({

      itemCode:
        currentItem.itemCode,

      itemName:
        currentItem.itemName,

      description:
        currentItem.description,

      unit:
        currentItem.unit,

      location:
        currentItem.location,

      qty:
        qty

    });

  }


  renderItems();


  document.getElementById(
    "itemQty"
  ).value = 1;


  setStatus(
    "➕ เพิ่มรายการแล้ว\n" +
    currentItem.itemCode
  );

}


/*************************************************
 * RENDER ITEMS
 *************************************************/

function renderItems() {

  const table =
    document.getElementById(
      "itemTable"
    );


  table.innerHTML = "";


  if (items.length === 0) {

    table.innerHTML =
      "<tr>" +
      "<td colspan='6' class='empty'>" +
      "ยังไม่มีรายการ" +
      "</td>" +
      "</tr>";

    return;

  }


  items.forEach(function(item, index) {

    const tr =
      document.createElement("tr");


    tr.innerHTML =

      "<td>" +
      (index + 1) +
      "</td>" +

      "<td><b>" +
      escapeHtml(item.itemCode) +
      "</b></td>" +

      "<td>" +
      escapeHtml(item.itemName) +
      "</td>" +

      "<td>" +
      escapeHtml(item.unit) +
      "</td>" +

      "<td>" +

      "<input " +
      "class='qty' " +
      "type='number' " +
      "min='1' " +
      "value='" +
      item.qty +
      "' " +
      "onchange='changeQty(" +
      index +
      ", this.value)'>" +

      "</td>" +

      "<td>" +

      "<button " +
      "class='delete' " +
      "onclick='deleteItem(" +
      index +
      ")'>" +

      "ลบ" +

      "</button>" +

      "</td>";


    table.appendChild(tr);

  });

}


/*************************************************
 * CHANGE QTY
 *************************************************/

function changeQty(index, value) {

  const qty =
    Number(value);


  if (!qty || qty <= 0) {

    items[index].qty = 1;

  }

  else {

    items[index].qty = qty;

  }


  renderItems();

}


/*************************************************
 * DELETE ITEM
 *************************************************/

function deleteItem(index) {

  items.splice(
    index,
    1
  );


  renderItems();

}


/*************************************************
 * SAVE REQUEST
 *************************************************/

function saveRequest() {

  const employee =
    document.getElementById(
      "employee"
    ).value.trim();


  const empId =
    document.getElementById(
      "empId"
    ).value.trim();


  const department =
    document.getElementById(
      "department"
    ).value.trim();


  const station =
    document.getElementById(
      "station"
    ).value.trim();


  const model =
    document.getElementById(
      "model"
    ).value.trim();


  const usedFor =
    document.getElementById(
      "usedFor"
    ).value.trim();


  if (!employee) {

    alert("กรุณากรอก Employee");

    return;

  }


  if (!empId) {

    alert("กรุณากรอก Emp. ID");

    return;

  }


  if (!department) {

    alert("กรุณากรอก Department");

    return;

  }


  if (!station) {

    alert("กรุณากรอก Station");

    return;

  }


  if (!model) {

    alert("กรุณากรอก Model");

    return;

  }


  if (!usedFor) {

    alert("กรุณากรอก Used for");

    return;

  }


  if (items.length === 0) {

    alert(
      "กรุณาเพิ่มรายการอย่างน้อย 1 Item"
    );

    return;

  }


  const formData = {

    employee:
      employee,

    empId:
      empId,

    department:
      department,

    station:
      station,

    model:
      model,

    usedFor:
      usedFor,

    items:
      items

  };


  setStatus(
    "⏳ กำลังบันทึกใบเบิก..."
  );


  const url =
    SCRIPT_URL +
    "?action=save" +
    "&data=" +
    encodeURIComponent(
      JSON.stringify(formData)
    ) +
    "&t=" +
    Date.now();


  fetch(url, {
    method: "GET",
    cache: "no-store"
  })

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    return response.json();

  })

  .then(function(result) {

    if (!result.success) {

      throw new Error(
        result.message ||
        "บันทึกไม่สำเร็จ"
      );

    }


    alert(

      "บันทึกใบเบิกสำเร็จ\n\n" +

      "Request No.: " +
      result.requestNo +
      "\n" +

      "รายการ: " +
      result.itemCount +
      " Item\n" +

      "จำนวนรวม: " +
      result.totalQty

    );


    setStatus(

      "✅ บันทึกสำเร็จ\n" +

      "Request No.: " +
      result.requestNo

    );


    items = [];

    renderItems();


    document.getElementById(
      "employee"
    ).value = "";

    document.getElementById(
      "empId"
    ).value = "";

    document.getElementById(
      "department"
    ).value = "";

    document.getElementById(
      "station"
    ).value = "";

    document.getElementById(
      "model"
    ).value = "";

    document.getElementById(
      "usedFor"
    ).value = "";

    document.getElementById(
      "itemCodeInput"
    ).value = "";

    document.getElementById(
      "itemInfo"
    ).style.display = "none";


    currentItem = null;

  })

  .catch(function(error) {

    console.error(error);


    setStatus(

      "❌ บันทึกไม่สำเร็จ\n" +

      error.message

    );

  });

}


/*************************************************
 * ESCAPE HTML
 *************************************************/

function escapeHtml(text) {

  return String(text || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>ระบบใบเบิกวัสดุ</title>

  <!-- QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .header,
    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    h3 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .scan-btn {
      background: #1a73e8;
      color: white;
    }

    .stop-btn {
      background: #777;
      color: white;
    }

    .search-btn {
      background: #607d8b;
      color: white;
    }

    .add-btn {
      background: #ff9800;
      color: white;
    }

    .save-btn {
      background: #188038;
      color: white;
      font-weight: bold;
    }

    .delete-btn {
      background: #d93025;
      color: white;
      width: auto;
      padding: 7px 10px;
      margin: 0;
    }

    #reader {
      width: 100%;
      margin-top: 12px;
    }

    .status {
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      background: #eeeeee;
      text-align: center;
      font-weight: bold;
      white-space: pre-line;
    }

    .item-info {
      background: #f1f8e9;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      line-height: 1.7;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #eeeeee;
    }

    .item-name {
      text-align: left;
    }

    .qty {
      width: 70px;
      padding: 7px;
      margin: 0;
    }

    .empty {
      color: #888;
      padding: 20px;
    }

  </style>

</head>


<body>

<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h2>📦 ระบบใบเบิกวัสดุ</h2>

    <p style="text-align:center;">
      ใบเบิกวัสดุหลายรายการ
    </p>

  </div>


  <!-- ข้อมูลผู้เบิก -->

  <div class="card">

    <h3>👤 ข้อมูลผู้เบิก</h3>


    <label>Employee</label>

    <input
      id="employee"
      type="text"
      placeholder="ชื่อ-นามสกุล"
    >


    <label>Emp. ID</label>

    <input
      id="empId"
      type="text"
      placeholder="รหัสพนักงาน"
    >


    <label>Department</label>

    <input
      id="department"
      type="text"
      placeholder="หน่วยงาน"
    >


    <label>Station</label>

    <input
      id="station"
      type="text"
      placeholder="Station"
    >


    <label>Model</label>

    <input
      id="model"
      type="text"
      placeholder="Model"
    >


    <label>Used for</label>

    <input
      id="usedFor"
      type="text"
      placeholder="ใช้สำหรับ"
    >

  </div>


  <!-- SCANNER -->

  <div class="card">

    <h3>📷 สแกนวัสดุ</h3>


    <button
      id="startBtn"
      class="scan-btn"
      onclick="startScanner()"
    >
      📷 สแกน QR Code
    </button>


    <button
      id="stopBtn"
      class="stop-btn"
      onclick="stopScanner()"
    >
      ⏹ หยุดกล้อง
    </button>


    <div id="reader"></div>


    <div
      id="scanStatus"
      class="status"
    >
      พร้อมสแกน
    </div>


    <!-- ITEM CODE -->

    <label>Item Code</label>

    <input
      id="itemCode"
      type="text"
      placeholder="สแกน QR หรือกรอก Item Code"
    >


    <button
      class="search-btn"
      onclick="searchItem()"
    >
      🔍 ค้นหา Item
    </button>


    <!-- ITEM INFORMATION -->

    <div id="itemInfo"></div>


    <!-- QUANTITY -->

    <label>จำนวน</label>

    <input
      id="qty"
      class="qty"
      type="number"
      min="1"
      value="1"
    >


    <button
      class="add-btn"
      onclick="addItem()"
    >
      ➕ เพิ่มรายการ
    </button>

  </div>


  <!-- ITEM LIST -->

  <div class="card">

    <h3>📋 รายการที่ต้องการเบิก</h3>


    <table>

      <thead>

        <tr>
          <th>#</th>
          <th>Item Code</th>
          <th>Item Name</th>
          <th>Unit</th>
          <th>Qty</th>
          <th></th>
        </tr>

      </thead>


      <tbody id="itemTable">

        <tr>

          <td
            colspan="6"
            class="empty"
          >
            ยังไม่มีรายการ
          </td>

        </tr>

      </tbody>

    </table>

  </div>


  <!-- SAVE -->

  <div class="card">

    <button
      class="save-btn"
      onclick="saveRequest()"
    >
      ✅ ยืนยันการเบิก
    </button>

  </div>


</div>


<script>


/*************************************************
 * Apps Script Web App URL
 *************************************************/

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxZzxnjtVFhG9hIsnM14nHRTpv9ASlabM6Zgnj9ZLiLnR1VXCKyRvwip9nz2Q7tdPVvBA/exec";


/*************************************************
 * ตัวแปรระบบ
 *************************************************/

let scanner = null;

let scannerRunning = false;

let selectedItem = null;

let items = [];

let lastScannedCode = "";

let scanLock = false;


/*************************************************
 * START SCANNER
 *************************************************/

async function startScanner() {

  if (scannerRunning) {

    document.getElementById("scanStatus")
      .innerText =
      "📷 กล้องกำลังทำงานอยู่";

    return;

  }


  document.getElementById("scanStatus")
    .innerText =
    "🔄 กำลังเปิดกล้อง...";


  try {

    scanner =
      new Html5Qrcode("reader");


    scannerRunning = true;


    await scanner.start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0

      },

      function(decodedText) {

        if (scanLock) {
          return;
        }


        scanLock = true;


        const code =
          String(decodedText || "")
            .trim();


        document.getElementById("scanStatus")
          .innerText =
          "✅ อ่าน QR สำเร็จ\n" +
          code;


        document.getElementById("itemCode")
          .value = code;


        stopScanner()
          .then(function() {

            scanLock = false;

            searchItem();

          });

      },

      function(errorMessage) {

        // ไม่แสดง error ระหว่างที่กล้องกำลังค้นหา QR

      }

    );


    document.getElementById("scanStatus")
      .innerText =
      "📷 พร้อมสแกน QR Code";


  }

  catch (error) {

    console.error(error);


    scannerRunning = false;

    scanner = null;


    document.getElementById("scanStatus")
      .innerText =
      "❌ ไม่สามารถเปิดกล้องได้\n" +
      "กรุณาตรวจสอบสิทธิ์กล้อง";


    alert(
      "ไม่สามารถเปิดกล้องได้\n\n" +
      "กรุณาอนุญาตให้ Chrome ใช้กล้อง " +
      "แล้วกดสแกนอีกครั้ง"
    );

  }

}


/*************************************************
 * STOP SCANNER
 *************************************************/

async function stopScanner() {

  if (!scanner) {

    scannerRunning = false;

    return;

  }


  try {

    if (scannerRunning) {

      await scanner.stop();

    }

  }

  catch (error) {

    console.log(
      "Scanner stop:",
      error
    );

  }


  try {

    scanner.clear();

  }

  catch (error) {

    console.log(
      "Scanner clear:",
      error
    );

  }


  scanner = null;

  scannerRunning = false;

}


/*************************************************
 * SEARCH ITEM
 *************************************************/

function searchItem() {

  const code =
    document.getElementById("itemCode")
      .value
      .trim();


  if (!code) {

    alert(
      "กรุณาสแกน QR หรือกรอก Item Code"
    );

    return;

  }


  document.getElementById("scanStatus")
    .innerText =
    "🔍 กำลังค้นหา Item...";


  google.script.run

    .withSuccessHandler(function(item) {

      if (!item) {

        selectedItem = null;


        document.getElementById("itemInfo")
          .innerHTML = "";


        document.getElementById("scanStatus")
          .innerText =
          "❌ ไม่พบ Item";


        alert(
          "ไม่พบ Item Code:\n" +
          code
        );

        return;

      }


      selectedItem = item;


      document.getElementById("scanStatus")
        .innerText =
        "✅ พบ Item";


      document.getElementById("itemInfo")
        .innerHTML = `

          <div class="item-info">

            <b>Item Code:</b>
            ${escapeHtml(item.itemCode)}

            <br>

            <b>Item Name:</b>
            ${escapeHtml(item.itemName)}

            <br>

            <b>Description:</b>
            ${escapeHtml(item.description)}

            <br>

            <b>Unit:</b>
            ${escapeHtml(item.unit)}

            <br>

            <b>Location:</b>
            ${escapeHtml(item.location)}

          </div>

        `;

    })

    .withFailureHandler(function(error) {

      console.error(error);


      document.getElementById("scanStatus")
        .innerText =
        "❌ เชื่อมต่อ Apps Script ไม่สำเร็จ";


      alert(
        "เชื่อมต่อ Apps Script ไม่สำเร็จ\n\n" +
        "กรุณาตรวจสอบ Deployment ของ Apps Script"
      );

    })

    .findItem(code);

}


/*************************************************
 * ADD ITEM
 *************************************************/

function addItem() {

  if (!selectedItem) {

    alert(
      "กรุณาสแกนหรือค้นหา Item ก่อน"
    );

    return;

  }


  const qty =
    Number(
      document.getElementById("qty")
        .value
    );


  if (!qty || qty <= 0) {

    alert(
      "กรุณาระบุจำนวน"
    );

    return;

  }


  const existing =
    items.find(function(item) {

      return (
        item.itemCode ===
        selectedItem.itemCode
      );

    });


  if (existing) {

    existing.qty += qty;

  }

  else {

    items.push({

      itemCode:
        selectedItem.itemCode,

      itemName:
        selectedItem.itemName,

      unit:
        selectedItem.unit,

      qty:
        qty

    });

  }


  renderTable();


  // เคลียร์ Item ปัจจุบัน

  selectedItem = null;


  document.getElementById("itemCode")
    .value = "";


  document.getElementById("qty")
    .value = "1";


  document.getElementById("itemInfo")
    .innerHTML = "";


  document.getElementById("scanStatus")
    .innerText =
    "✅ เพิ่มรายการแล้ว\nพร้อมสแกนรายการถัดไป";


  lastScannedCode = "";

}


/*************************************************
 * RENDER TABLE
 *************************************************/

function renderTable() {

  const table =
    document.getElementById("itemTable");


  table.innerHTML = "";


  if (items.length === 0) {

    table.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty"
        >
          ยังไม่มีรายการ
        </td>

      </tr>

    `;

    return;

  }


  items.forEach(function(item, index) {

    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td>
        ${index + 1}
      </td>

      <td>
        ${escapeHtml(item.itemCode)}
      </td>

      <td class="item-name">
        ${escapeHtml(item.itemName)}
      </td>

      <td>
        ${escapeHtml(item.unit)}
      </td>

      <td>

        <input
          class="qty"
          type="number"
          min="1"
          value="${item.qty}"
          onchange="changeQty(${index}, this.value)"
        >

      </td>

      <td>

        <button
          class="delete-btn"
          onclick="deleteItem(${index})"
        >
          ลบ
        </button>

      </td>

    `;


    table.appendChild(row);

  });

}


/*************************************************
 * CHANGE QTY
 *************************************************/

function changeQty(index, value) {

  const qty =
    Number(value);


  if (!qty || qty <= 0) {

    items[index].qty = 1;

  }

  else {

    items[index].qty = qty;

  }


  renderTable();

}


/*************************************************
 * DELETE ITEM
 *************************************************/

function deleteItem(index) {

  items.splice(index, 1);

  renderTable();

}


/*************************************************
 * SAVE REQUEST
 *************************************************/

function saveRequest() {

  const employee =
    document.getElementById("employee")
      .value.trim();


  const empId =
    document.getElementById("empId")
      .value.trim();


  const department =
    document.getElementById("department")
      .value.trim();


  const station =
    document.getElementById("station")
      .value.trim();


  const model =
    document.getElementById("model")
      .value.trim();


  const usedFor =
    document.getElementById("usedFor")
      .value.trim();


  if (!employee) {

    alert(
      "กรุณากรอก Employee"
    );

    return;

  }


  if (!empId) {

    alert(
      "กรุณากรอก Emp. ID"
    );

    return;

  }


  if (!department) {

    alert(
      "กรุณากรอก Department"
    );

    return;

  }


  if (!station) {

    alert(
      "กรุณากรอก Station"
    );

    return;

  }


  if (!model) {

    alert(
      "กรุณากรอก Model"
    );

    return;

  }


  if (!usedFor) {

    alert(
      "กรุณากรอก Used for"
    );

    return;

  }


  if (items.length === 0) {

    alert(
      "กรุณาเพิ่มรายการวัสดุอย่างน้อย 1 รายการ"
    );

    return;

  }


  const formData = {

    employee:
      employee,

    empId:
      empId,

    department:
      department,

    station:
      station,

    model:
      model,

    usedFor:
      usedFor,

    items:
      items

  };


  document.getElementById("scanStatus")
    .innerText =
    "⏳ กำลังบันทึกใบเบิก...";


  google.script.run

    .withSuccessHandler(function(result) {

      if (!result || !result.success) {

        document.getElementById("scanStatus")
          .innerText =
          "❌ บันทึกไม่สำเร็จ";

        return;

      }


      alert(

        "✅ บันทึกใบเบิกสำเร็จ\n\n" +

        "Request No.: " +
        result.requestNo +

        "\nจำนวนรายการ: " +
        result.itemCount

      );


      // รีเซ็ตระบบ

      items = [];

      selectedItem = null;


      renderTable();


      document.getElementById("employee")
        .value = "";


      document.getElementById("empId")
        .value = "";


      document.getElementById("department")
        .value = "";


      document.getElementById("station")
        .value = "";


      document.getElementById("model")
        .value = "";


      document.getElementById("usedFor")
        .value = "";


      document.getElementById("itemCode")
        .value = "";


      document.getElementById("itemInfo")
        .innerHTML = "";


      document.getElementById("scanStatus")
        .innerText =
        "พร้อมสำหรับใบเบิกใหม่";

    })

    .withFailureHandler(function(error) {

      console.error(error);


      document.getElementById("scanStatus")
        .innerText =
        "❌ บันทึกไม่สำเร็จ";


      alert(
        "ไม่สามารถบันทึกใบเบิกได้\n\n" +
        error.message
      );

    })

    .saveRequest(formData);

}


/*************************************************
 * ESCAPE HTML
 *************************************************/

function escapeHtml(text) {

  return String(text || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/*************************************************
 * เมื่อปิด/ออกจากหน้า
 *************************************************/

window.addEventListener(
  "beforeunload",
  function() {

    if (scanner) {

      try {

        scanner.stop();

      }

      catch (e) {}

    }

  }
);


</script>

</body>

</html>

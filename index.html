<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
}

h2 {
  text-align: center;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 8px;
  font-size: 17px;
}

#startBtn {
  background: #1a73e8;
  color: white;
}

#stopBtn {
  background: #777;
  color: white;
}

#reader {
  margin-top: 15px;
}

#result {
  margin-top: 15px;
  padding: 15px;
  background: #eee;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
  word-break: break-all;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>📷 QR Scanner</h2>

<button
  id="startBtn"
  onclick="startScanner()">
เริ่มสแกน
</button>

<button
  id="stopBtn"
  onclick="stopScanner()">
หยุดสแกน
</button>

<div id="reader"></div>

<div id="result">
พร้อมสแกน
</div>

</div>

</div>

<script>

let scanner = null;


/* ================================
   เริ่มกล้อง
================================ */

function startScanner() {

  if (scanner) {

    document.getElementById("result")
      .innerText =
      "📷 กล้องกำลังทำงาน";

    return;

  }


  document.getElementById("result")
    .innerText =
    "🔄 กำลังเปิดกล้อง...";


  scanner =
    new Html5Qrcode("reader");


  Html5Qrcode.getCameras()

    .then(function(cameras) {

      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "ไม่พบกล้อง"
        );

      }


      let cameraId =
        cameras[0].id;


      /* เลือกกล้องหลัง ถ้ามี */

      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          (
            cameras[i].label || ""
          ).toLowerCase();


        if (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        ) {

          cameraId =
            cameras[i].id;

          break;

        }

      }


      return scanner.start(

        cameraId,

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        function(decodedText) {

          const code =
            decodedText.trim();


          document.getElementById("result")
            .innerText =
            "✅ สแกนสำเร็จ\n\n" +
            code;


          stopScanner();

        },

        function() {

          /* ไม่แสดง error
             ระหว่างค้นหา QR */

        }

      );

    })

    .catch(function(error) {

      console.error(error);

      scanner = null;

      document.getElementById("result")
        .innerText =
        "❌ ไม่สามารถเปิดกล้องได้";

    });

}


/* ================================
   หยุดกล้อง
================================ */

function stopScanner() {

  if (!scanner) {

    return;

  }


  scanner.stop()

    .then(function() {

      scanner.clear();

      scanner = null;

      document.getElementById("result")
        .innerText =
        "⏹ หยุดสแกนแล้ว";

    })

    .catch(function(error) {

      console.log(error);

      scanner = null;

    });

}

</script>

</body>
</html>

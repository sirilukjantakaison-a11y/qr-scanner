```html
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 14px;
      margin-top: 10px;
      font-size: 17px;
      cursor: pointer;
    }

    .blue {
      background: #1a73e8;
      color: white;
    }

    .gray {
      background: #666;
      color: white;
    }

    .green {
      background: #188038;
      color: white;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      text-align: center;
      white-space: pre-line;
      font-weight: bold;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      word-break: break-all;
    }

    .hidden {
      display: none;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h2>📷 QR Scanner</h2>

    <button
      class="blue"
      onclick="startScanner()">
      เปิดกล้องและสแกน QR
    </button>

    <button
      class="gray"
      onclick="stopScanner()">
      หยุดกล้อง
    </button>

    <div id="reader"></div>

    <div id="status" class="status">
      พร้อมใช้งาน
    </div>

    <div id="result" class="result hidden">

      <b>ข้อมูลจาก QR</b>

      <div id="decodedText"></div>

      <button
        class="green"
        onclick="copyResult()">
        📋 คัดลอก
      </button>

    </div>

  </div>

</div>


<script>

let scanner = null;
let scanning = false;
let lastResult = "";


/* =================================================
   STATUS
================================================= */

function setStatus(message) {

  document.getElementById("status").innerText =
    message;

}


/* =================================================
   START SCANNER
================================================= */

async function startScanner() {

  if (scanning) {

    setStatus(
      "📷 กล้องกำลังทำงานอยู่"
    );

    return;
  }

  setStatus(
    "⏳ กำลังตรวจสอบกล้อง..."
  );

  try {

    /* ---------------------------------------------
       ตรวจสอบ HTTPS
    --------------------------------------------- */

    if (!window.isSecureContext) {

      throw new Error(
        "หน้านี้ไม่ใช่ HTTPS"
      );

    }


    /* ---------------------------------------------
       ตรวจสอบ Browser
    --------------------------------------------- */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser ไม่รองรับการใช้งานกล้อง"
      );

    }


    /* ---------------------------------------------
       ขอสิทธิ์กล้องก่อน
    --------------------------------------------- */

    setStatus(
      "📷 กำลังขอสิทธิ์ใช้กล้อง..."
    );

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true
      });


    /* ---------------------------------------------
       ปิด stream ทดสอบ
    --------------------------------------------- */

    stream.getTracks().forEach(
      function(track) {
        track.stop();
      }
    );


    /* ---------------------------------------------
       อ่านรายการกล้อง
    --------------------------------------------- */

    const cameras =
      await Html5Qrcode.getCameras();


    if (!cameras || cameras.length === 0) {

      throw new Error(
        "ไม่พบกล้องในอุปกรณ์"
      );

    }


    /* ---------------------------------------------
       เลือกกล้องหลัง
    --------------------------------------------- */

    let cameraId =
      cameras[0].id;


    const backCamera =
      cameras.find(
        function(camera) {

          const label =
            String(
              camera.label || ""
            ).toLowerCase();

          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment")
          );

        }
      );


    if (backCamera) {

      cameraId =
        backCamera.id;

    }


    /* ---------------------------------------------
       สร้าง Scanner
    --------------------------------------------- */

    scanner =
      new Html5Qrcode("reader");


    scanning = true;


    setStatus(
      "⏳ กำลังเปิดกล้อง..."
    );


    /* ---------------------------------------------
       เริ่ม Scanner
    --------------------------------------------- */

    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const minSize =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            );

          const size =
            Math.floor(
              minSize * 0.70
            );

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0,

        disableFlip: false

      },

      function(decodedText) {

        handleQR(decodedText);

      },

      function(errorMessage) {

        /*
         ไม่แสดง error ทุกเฟรม
         เพราะเป็นเรื่องปกติเมื่อยังหา QR ไม่เจอ
        */

      }

    );


    setStatus(
      "✅ กล้องพร้อม\nกรุณาหันกล้องไปที่ QR"
    );


  }
  catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    scanning = false;


    if (scanner) {

      try {

        await scanner.clear();

      }
      catch (e) {

        console.log(e);

      }

    }


    scanner = null;


    let message =
      "❌ ไม่สามารถเปิดกล้องได้";


    if (error && error.name) {

      message +=
        "\nError: " +
        error.name;

    }


    if (error && error.message) {

      message +=
        "\n" +
        error.message;

    }


    message +=
      "\n\nกรุณาตรวจสอบสิทธิ์กล้องของ Chrome";


    setStatus(message);

  }

}


/* =================================================
   HANDLE QR
================================================= */

async function handleQR(decodedText) {

  const text =
    String(decodedText || "").trim();


  if (!text) {
    return;
  }


  if (text === lastResult) {
    return;
  }


  lastResult = text;


  await stopScanner();


  document.getElementById(
    "decodedText"
  ).innerText =
    text;


  document.getElementById(
    "result"
  ).classList.remove(
    "hidden"
  );


  setStatus(
    "✅ สแกน QR สำเร็จ"
  );

}


/* =================================================
   STOP SCANNER
================================================= */

async function stopScanner() {

  if (!scanner) {

    scanning = false;

    return;

  }


  try {

    if (scanning) {

      await scanner.stop();

    }

  }
  catch (error) {

    console.log(
      "Stop camera:",
      error
    );

  }


  try {

    await scanner.clear();

  }
  catch (error) {

    console.log(
      "Clear scanner:",
      error
    );

  }


  scanner = null;

  scanning = false;


  setStatus(
    "⏹ หยุดกล้องแล้ว"
  );

}


/* =================================================
   COPY RESULT
================================================= */

async function copyResult() {

  const text =
    document.getElementById(
      "decodedText"
    ).innerText;


  if (!text) {
    return;
  }


  try {

    await navigator.clipboard.writeText(
      text
    );

    setStatus(
      "📋 คัดลอกข้อมูลแล้ว"
    );

  }
  catch (error) {

    setStatus(
      "ไม่สามารถคัดลอกอัตโนมัติได้"
    );

  }

}

</script>

</body>
</html>

```html
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
}

.container {
  max-width: 600px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h2 {
  text-align: center;
  margin-top: 0;
}

button {
  width: 100%;
  border: 0;
  border-radius: 8px;
  padding: 14px;
  margin-top: 10px;
  font-size: 17px;
  cursor: pointer;
}

.blue {
  background: #1a73e8;
  color: white;
}

.gray {
  background: #666;
  color: white;
}

.green {
  background: #188038;
  color: white;
}

.status {
  margin-top: 15px;
  padding: 12px;
  text-align: center;
  white-space: pre-line;
  font-weight: bold;
  line-height: 1.5;
}

#reader {
  width: 100%;
  margin-top: 15px;
}

.result {
  margin-top: 15px;
  padding: 15px;
  background: #f8f9fa;
  border-radius: 8px;
  word-break: break-all;
}

.hidden {
  display: none;
}

.danger {
  color: #d93025;
}

.camera-list {
  margin-top: 10px;
}

.camera-list button {
  font-size: 14px;
  padding: 10px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h2>📷 QR Scanner</h2>

<button
  id="startButton"
  class="blue"
  onclick="startScanner()">
เปิดกล้องและสแกน QR
</button>

<button
  class="gray"
  onclick="stopScanner()">
หยุดกล้อง
</button>

<div id="reader"></div>

<div id="status" class="status">
พร้อมใช้งาน
</div>

<div id="cameraList" class="camera-list"></div>

<div id="result" class="result hidden">

<b>ข้อมูลจาก QR</b>

<div id="decodedText"></div>

<button
  class="green"
  onclick="copyResult()">
📋 คัดลอก
</button>

</div>

</div>

</div>


<script>

/* =================================================
   GLOBAL
================================================= */

let scanner = null;
let scanning = false;
let lastResult = "";


/* =================================================
   STATUS
================================================= */

function setStatus(message) {

  const el =
    document.getElementById("status");

  el.innerText = message;

}


/* =================================================
   START SCANNER
================================================= */

async function startScanner() {

  if (scanning) {

    setStatus(
      "📷 กล้องกำลังทำงานอยู่"
    );

    return;

  }


  setStatus(
    "⏳ กำลังเตรียมกล้อง..."
  );


  try {

    /* ---------------------------------------------
       1. ตรวจ HTTPS
    --------------------------------------------- */

    if (
      !window.isSecureContext &&
      location.hostname !== "localhost"
    ) {

      throw new Error(
        "เว็บไซต์ไม่ใช่ HTTPS"
      );

    }


    /* ---------------------------------------------
       2. ตรวจ Browser
    --------------------------------------------- */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser ไม่รองรับ getUserMedia"
      );

    }


    /* ---------------------------------------------
       3. ขอสิทธิ์กล้อง
       ใช้กล้องหลังโดยตรง
    --------------------------------------------- */

    setStatus(
      "📷 กรุณาอนุญาตการใช้กล้อง..."
    );


    let testStream = null;


    try {

      testStream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

    }
    finally {

      if (testStream) {

        testStream
          .getTracks()
          .forEach(function(track) {

            track.stop();

          });

      }

    }


    /* ---------------------------------------------
       4. สร้าง QR Scanner
    --------------------------------------------- */

    scanner =
      new Html5Qrcode("reader");


    scanning = true;


    setStatus(
      "⏳ กำลังเปิดกล้อง..."
    );


    /* ---------------------------------------------
       5. ใช้ facingMode
       ไม่เรียก getCameras ซ้ำ
    --------------------------------------------- */

    await scanner.start(

      {
        facingMode: "environment"
      },

      {

        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(width, height) * 0.70
            );

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0,

        disableFlip: false

      },

      function(decodedText) {

        handleQR(decodedText);

      },

      function() {

        /*
         ไม่แสดง error ทุก frame
        เพราะตอนยังหา QR ไม่เจอ
        ถือเป็นเรื่องปกติ
        */

      }

    );


    setStatus(
      "✅ กล้องพร้อม\nหันกล้องไปที่ QR"
    );


  }
  catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    scanning = false;


    if (scanner) {

      try {

        await scanner.clear();

      }
      catch (e) {

        console.log(e);

      }

    }


    scanner = null;


    showCameraError(error);

  }

}


/* =================================================
   CAMERA ERROR
================================================= */

function showCameraError(error) {

  let message =
    "❌ ไม่สามารถเปิดกล้องได้";


  if (error && error.name) {

    message +=
      "\n\nError: " +
      error.name;

  }


  if (error && error.message) {

    message +=
      "\n" +
      error.message;

  }


  /* ---------------------------------------------
     แนะนำตาม Error
  --------------------------------------------- */

  if (
    error &&
    error.name === "NotAllowedError"
  ) {

    message +=
      "\n\n🔐 Chrome ไม่ได้รับอนุญาตให้ใช้กล้อง" +
      "\nกดไอคอน 🔒 ด้านซ้ายของ URL" +
      "\nเลือก Camera → Allow" +
      "\nแล้ว Reload หน้าเว็บ";

  }


  else if (
    error &&
    error.name === "NotFoundError"
  ) {

    message +=
      "\n\n📷 ไม่พบกล้องในอุปกรณ์";

  }


  else if (
    error &&
    error.name === "NotReadableError"
  ) {

    message +=
      "\n\n📷 กล้องอาจถูกใช้งานโดยแอปอื่น" +
      "\nกรุณาปิดแอปที่กำลังใช้กล้อง";

  }


  else if (
    error &&
    error.name === "OverconstrainedError"
  ) {

    message +=
      "\n\n📷 กล้องหลังไม่สามารถใช้งานได้" +
      "\nระบบจะลองกล้องอื่นในขั้นถัดไป";

  }


  else if (
    error &&
    error.name === "SecurityError"
  ) {

    message +=
      "\n\n🔐 Browser ปฏิเสธการใช้งานกล้อง" +
      "\nตรวจสอบ HTTPS และสิทธิ์ Camera";

  }


  message +=
    "\n\nURL ต้องเป็น HTTPS";


  setStatus(message);

}


/* =================================================
   HANDLE QR
================================================= */

async function handleQR(decodedText) {

  const text =
    String(decodedText || "")
      .trim();


  if (!text) {
    return;
  }


  if (text === lastResult) {
    return;
  }


  lastResult = text;


  await stopScanner();


  document.getElementById(
    "decodedText"
  ).innerText = text;


  document.getElementById(
    "result"
  ).classList.remove("hidden");


  setStatus(
    "✅ สแกน QR สำเร็จ"
  );

}


/* =================================================
   STOP SCANNER
================================================= */

async function stopScanner() {

  if (!scanner) {

    scanning = false;

    setStatus(
      "⏹ ไม่มีกล้องกำลังทำงาน"
    );

    return;

  }


  try {

    if (scanning) {

      await scanner.stop();

    }

  }
  catch (error) {

    console.log(
      "Stop camera:",
      error
    );

  }


  try {

    await scanner.clear();

  }
  catch (error) {

    console.log(
      "Clear scanner:",
      error
    );

  }


  scanner = null;

  scanning = false;


  setStatus(
    "⏹ หยุดกล้องแล้ว"
  );

}


/* =================================================
   COPY
================================================= */

async function copyResult() {

  const text =
    document.getElementById(
      "decodedText"
    ).innerText;


  if (!text) {
    return;
  }


  try {

    await navigator.clipboard.writeText(
      text
    );

    setStatus(
      "📋 คัดลอกข้อมูลแล้ว"
    );

  }
  catch (error) {

    setStatus(
      "❌ ไม่สามารถคัดลอกอัตโนมัติได้"
    );

  }

}


/* =================================================
   PAGE LOAD
================================================= */

window.addEventListener(
  "load",
  function() {

    if (
      location.protocol === "https:" ||
      location.hostname === "localhost"
    ) {

      setStatus(
        "พร้อมใช้งาน\nกดปุ่มเปิดกล้องเพื่อเริ่ม"
      );

    }
    else {

      setStatus(
        "⚠️ หน้านี้ไม่ใช่ HTTPS"
      );

    }

  }
);

</script>

</body>
</html>
```

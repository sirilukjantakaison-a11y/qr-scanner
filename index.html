<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>QR Scanner</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

.container {
  max-width: 500px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
}

h2 {
  text-align: center;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 9px;
  font-size: 17px;
  font-weight: bold;
}

.start {
  background: #1976d2;
  color: white;
}

.stop {
  background: #757575;
  color: white;
}

.image {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 9px;
  background: #ef6c00;
  color: white;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
}

#imageInput {
  display: none;
}

#cameraArea {
  display: none;
  position: relative;
  margin-top: 15px;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
}

#video {
  width: 100%;
  display: block;
}

.scan-frame {
  position: absolute;
  width: 65%;
  aspect-ratio: 1 / 1;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border: 3px solid #00e676;
  border-radius: 15px;
}

#status {
  margin-top: 12px;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
  white-space: pre-line;
  background: #e3f2fd;
  color: #1565c0;
}

.success {
  background: #e8f5e9 !important;
  color: #2e7d32 !important;
}

.error {
  background: #ffebee !important;
  color: #c62828 !important;
}

#result {
  display: none;
  margin-top: 15px;
  padding: 15px;
  background: #f1f8e9;
  border-radius: 10px;
  text-align: center;
  font-size: 21px;
  font-weight: bold;
  word-break: break-all;
}

</style>

</head>


<body>

<div class="container">

<div class="card">

<h2>📷 QR Scanner</h2>

<p style="text-align:center">
สแกน Item Code
</p>


<button
  class="start"
  onclick="startCamera()"
>
📷 เปิดกล้องสแกน QR
</button>


<button
  class="stop"
  onclick="stopCamera()"
>
⏹ หยุดกล้อง
</button>


<label
  class="image"
  for="imageInput"
>
🖼️ เลือกรูป QR จากเครื่อง
</label>


<input
  id="imageInput"
  type="file"
  accept="image/*"
  onchange="scanImage(this)"
>


<div id="cameraArea">

<video
  id="video"
  autoplay
  playsinline
  muted
></video>

<div class="scan-frame"></div>

</div>


<div
  id="status"
>
พร้อมสแกน
</div>


<div id="result"></div>

</div>

</div>


<script>

/*************************************************
 * ตัวแปร
 *************************************************/

let stream = null;

let scanning = false;

let detector = null;


/*************************************************
 * URL สำหรับกลับระบบใบเบิก
 *
 * ระบบใบเบิกจะส่งมาแบบ:
 *
 * ?return=https://script.google.com/...
 *************************************************/

const params =
  new URLSearchParams(
    window.location.search
  );


const returnUrl =
  params.get("return");


/*************************************************
 * เปิดกล้อง
 *************************************************/

async function startCamera() {

  const status =
    document.getElementById("status");


  status.className = "";

  status.innerText =
    "⏳ กำลังเปิดกล้อง...";


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "เบราว์เซอร์ไม่รองรับการเปิดกล้อง"
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    const video =
      document.getElementById("video");


    video.srcObject = stream;


    await video.play();


    document
      .getElementById("cameraArea")
      .style.display = "block";


    status.className = "";

    status.innerText =
      "📷 กำลังสแกน QR Code...";


    scanning = true;


    startDetection();

  }

  catch(error) {

    console.error(error);


    let message =
      "❌ ไม่สามารถเปิดกล้องได้";


    if (
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "❌ ไม่สามารถเปิดกล้องได้\n\n" +
        "กรุณาอนุญาต Camera ให้เว็บไซต์นี้";

    }

    else if (
      error.name ===
      "NotFoundError"
    ) {

      message =
        "❌ ไม่พบกล้อง";

    }

    else if (
      error.name ===
      "NotReadableError"
    ) {

      message =
        "❌ กล้องกำลังถูกใช้งานโดยแอปอื่น";

    }

    else if (
      error.name ===
      "SecurityError"
    ) {

      message =
        "❌ เบราว์เซอร์ไม่อนุญาตให้ใช้กล้อง";

    }

    else {

      message +=
        "\n\n" +
        error.message;

    }


    status.className = "error";

    status.innerText =
      message;

  }

}


/*************************************************
 * เริ่มอ่าน QR
 *************************************************/

function startDetection() {

  if (
    !("BarcodeDetector" in window)
  ) {

    document
      .getElementById("status")
      .className = "error";


    document
      .getElementById("status")
      .innerText =
        "⚠️ Android/Browser นี้ไม่รองรับ\n" +
        "การสแกน QR แบบ Real-time\n\n" +
        "ให้ใช้ 'เลือกรูป QR จากเครื่อง'";

    return;

  }


  detector =
    new BarcodeDetector({
      formats: ["qr_code"]
    });


  detectQR();

}


/*************************************************
 * ตรวจ QR
 *************************************************/

async function detectQR() {

  if (!scanning) {
    return;
  }


  const video =
    document.getElementById("video");


  if (
    video.readyState >= 2 &&
    video.videoWidth > 0
  ) {

    try {

      const codes =
        await detector.detect(video);


      if (
        codes &&
        codes.length > 0
      ) {

        const value =
          codes[0].rawValue;


        if (value) {

          qrFound(value);

          return;

        }

      }

    }

    catch(error) {

      console.log(error);

    }

  }


  requestAnimationFrame(
    detectQR
  );

}


/*************************************************
 * พบ QR
 *************************************************/

function qrFound(value) {

  scanning = false;


  stopCamera();


  const itemCode =
    String(value).trim();


  document
    .getElementById("status")
    .className = "success";


  document
    .getElementById("status")
    .innerText =
      "✅ สแกนสำเร็จ";


  const result =
    document.getElementById("result");


  result.style.display = "block";

  result.innerText =
    itemCode;


  /*
   * ถ้ามี URL กลับระบบใบเบิก
   * ให้ส่ง Item Code กลับทันที
   */

  if (returnUrl) {

    setTimeout(
      function() {

        goBack(itemCode);

      },
      500
    );

  }

}


/*************************************************
 * กลับระบบใบเบิก
 *************************************************/

function goBack(itemCode) {

  try {

    const url =
      new URL(returnUrl);


    url.searchParams.set(
      "itemCode",
      itemCode
    );


    window.location.href =
      url.toString();

  }

  catch(error) {

    console.error(error);


    document
      .getElementById("status")
      .className = "error";


    document
      .getElementById("status")
      .innerText =
        "สแกนสำเร็จ แต่ไม่สามารถกลับระบบใบเบิกได้";

  }

}


/*************************************************
 * หยุดกล้อง
 *************************************************/

function stopCamera() {

  scanning = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream = null;

  }


  const video =
    document.getElementById("video");


  video.srcObject = null;


  document
    .getElementById("cameraArea")
    .style.display = "none";

}


/*************************************************
 * อ่าน QR จากรูป
 *************************************************/

async function scanImage(input) {

  const file =
    input.files &&
    input.files[0];


  if (!file) {
    return;
  }


  const status =
    document.getElementById("status");


  status.className = "";

  status.innerText =
    "🔄 กำลังอ่าน QR จากรูป...";


  if (
    !("BarcodeDetector" in window)
  ) {

    status.className = "error";

    status.innerText =
      "เบราว์เซอร์ไม่รองรับการอ่าน QR จากรูป";

    return;

  }


  const image =
    new Image();


  image.onload =
    async function() {

      try {

        const detector =
          new BarcodeDetector({
            formats: ["qr_code"]
          });


        const codes =
          await detector.detect(image);


        if (!codes.length) {

          throw new Error(
            "ไม่พบ QR Code ในรูป"
          );

        }


        qrFound(
          codes[0].rawValue
        );

      }

      catch(error) {

        status.className = "error";

        status.innerText =
          "❌ " +
          error.message;

      }

    };


  image.src =
    URL.createObjectURL(file);

}

</script>

</body>

</html>

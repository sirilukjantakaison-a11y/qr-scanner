<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>QR Scanner - ระบบใบเบิกวัสดุ</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

.container {
  max-width: 500px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

h2 {
  text-align: center;
  margin-top: 5px;
}

h3 {
  margin-top: 0;
}

button {
  width: 100%;
  border: 0;
  border-radius: 9px;
  padding: 14px;
  margin-top: 10px;
  font-size: 17px;
  font-weight: bold;
}

.start {
  background: #1976d2;
  color: white;
}

.stop {
  background: #757575;
  color: white;
}

.scan-image {
  background: #ef6c00;
  color: white;
}

#cameraArea {
  display: none;
  margin-top: 15px;
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  background: #000;
}

#video {
  width: 100%;
  display: block;
  background: #000;
}

.scan-frame {
  position: absolute;
  width: 65%;
  aspect-ratio: 1 / 1;
  border: 3px solid #00e676;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 15px;
  pointer-events: none;
}

#status {
  margin-top: 12px;
  padding: 12px;
  border-radius: 8px;
  background: #eeeeee;
  text-align: center;
  font-weight: bold;
}

.success {
  background: #e8f5e9 !important;
  color: #2e7d32;
}

.error {
  background: #ffebee !important;
  color: #c62828;
}

.info {
  background: #e3f2fd !important;
  color: #1565c0;
}

input[type="file"] {
  display: none;
}

.result-code {
  font-size: 22px;
  font-weight: bold;
  text-align: center;
  margin-top: 15px;
  padding: 15px;
  background: #f1f8e9;
  border-radius: 10px;
  word-break: break-all;
}

.back-btn {
  background: #424242;
  color: white;
}

</style>

</head>


<body>

<div class="container">

<div class="card">

<h2>📷 QR Scanner</h2>

<p style="text-align:center">
ระบบสแกน Item Code
</p>


<button
  class="start"
  onclick="startCamera()"
>
📷 เปิดกล้องสแกน QR
</button>


<button
  class="stop"
  onclick="stopCamera()"
>
⏹ หยุดกล้อง
</button>


<label
  for="imageInput"
  class="scan-image"
  style="
    display:block;
    text-align:center;
    cursor:pointer;
    margin-top:10px;
    border-radius:9px;
    padding:14px;
    font-size:17px;
    font-weight:bold;
  "
>
🖼️ เลือกรูป QR จากเครื่อง
</label>

<input
  id="imageInput"
  type="file"
  accept="image/*"
  onchange="scanImage(this)"
>


<div id="cameraArea">

<video
  id="video"
  autoplay
  playsinline
  muted
></video>

<div class="scan-frame"></div>

</div>


<div
  id="status"
  class="info"
>
พร้อมสแกน
</div>


<div
  id="resultCode"
  class="result-code"
  style="display:none"
>
</div>


<button
  id="backBtn"
  class="back-btn"
  onclick="backToRequest()"
  style="display:none"
>
↩️ กลับระบบใบเบิก
</button>

</div>

</div>


<script>

/*************************************************
 * CONFIG
 *************************************************/

const REQUEST_URL =
"https://script.google.com/macros/s/AKfycbwW5yF3ZFn-tbh8XC-_4WmYNJDOV49CKMYwolu7O-DaKSt5ayOqQgKaH7ccLvD6dkohKg/exec";


let stream = null;

let scanning = false;

let detector = null;


/*************************************************
 * START CAMERA
 *************************************************/

async function startCamera() {

  const status =
    document.getElementById("status");

  status.className = "info";

  status.innerText =
    "⏳ กำลังขอสิทธิ์ใช้กล้อง...";


  try {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง"
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    const video =
      document.getElementById("video");


    video.srcObject = stream;


    await video.play();


    document
      .getElementById("cameraArea")
      .style.display = "block";


    status.className = "info";

    status.innerText =
      "📷 กำลังสแกน QR Code...";


    scanning = true;


    startQRDetection();

  }

  catch(error) {

    console.error(error);


    let message =
      "❌ ไม่สามารถเปิดกล้องได้";


    if (error.name === "NotAllowedError") {

      message =
        "❌ ไม่สามารถเปิดกล้องได้\n\n" +
        "กรุณาอนุญาต Camera ในเบราว์เซอร์";

    }

    else if (error.name === "NotFoundError") {

      message =
        "❌ ไม่พบกล้อง";

    }

    else if (error.name === "NotReadableError") {

      message =
        "❌ กล้องถูกใช้งานโดยแอปอื่น";

    }

    else if (error.name === "SecurityError") {

      message =
        "❌ เบราว์เซอร์ไม่อนุญาตให้ใช้กล้อง";

    }

    else {

      message +=
        "\n\n" +
        error.message;

    }


    status.className = "error";

    status.innerText = message;

  }

}


/*************************************************
 * STOP CAMERA
 *************************************************/

function stopCamera() {

  scanning = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    stream = null;

  }


  const video =
    document.getElementById("video");


  video.srcObject = null;


  document
    .getElementById("cameraArea")
    .style.display = "none";


  document
    .getElementById("status")
    .innerText =
      "หยุดกล้องแล้ว";

}


/*************************************************
 * QR DETECTION
 *************************************************/

function startQRDetection() {

  if (!("BarcodeDetector" in window)) {

    document
      .getElementById("status")
      .className = "error";

    document
      .getElementById("status")
      .innerText =
        "⚠️ เบราว์เซอร์ไม่รองรับการสแกน QR แบบ Real-time\n\n" +
        "ให้ใช้ปุ่ม 'เลือกรูป QR จากเครื่อง'";

    return;

  }


  detector =
    new BarcodeDetector({
      formats: ["qr_code"]
    });


  detectQR();

}


/*************************************************
 * DETECT QR
 *************************************************/

async function detectQR() {

  if (!scanning) {

    return;

  }


  const video =
    document.getElementById("video");


  if (
    video.readyState >= 2 &&
    video.videoWidth > 0
  ) {

    try {

      const codes =
        await detector.detect(video);


      if (codes.length > 0) {

        const value =
          codes[0].rawValue;


        if (value) {

          qrFound(value);

          return;

        }

      }

    }

    catch(error) {

      console.log(
        "QR detect:",
        error
      );

    }

  }


  requestAnimationFrame(
    detectQR
  );

}


/*************************************************
 * QR FOUND
 *************************************************/

function qrFound(value) {

  scanning = false;


  stopCamera();


  const code =
    String(value).trim();


  document
    .getElementById("status")
    .className = "success";


  document
    .getElementById("status")
    .innerText =
      "✅ สแกนสำเร็จ";


  const result =
    document.getElementById("resultCode");


  result.style.display = "block";


  result.innerText =
    code;


  document
    .getElementById("backBtn")
    .style.display = "block";


  /*
   * ส่ง Item Code กลับระบบใบเบิก
   */

  sendCodeToRequest(code);

}


/*************************************************
 * SCAN IMAGE
 *************************************************/

function scanImage(input) {

  const file =
    input.files &&
    input.files[0];


  if (!file) {

    return;

  }


  document
    .getElementById("status")
    .className = "info";


  document
    .getElementById("status")
    .innerText =
      "🔄 กำลังอ่าน QR จากรูป...";


  if (!("BarcodeDetector" in window)) {

    document
      .getElementById("status")
      .className = "error";

    document
      .getElementById("status")
      .innerText =
        "เบราว์เซอร์นี้ไม่รองรับการอ่าน QR จากรูป";

    return;

  }


  const image =
    new Image();


  image.onload =
    async function() {

      try {

        const detector =
          new BarcodeDetector({
            formats: ["qr_code"]
          });


        const codes =
          await detector.detect(image);


        if (!codes.length) {

          throw new Error(
            "ไม่พบ QR Code ในรูป"
          );

        }


        qrFound(
          codes[0].rawValue
        );

      }

      catch(error) {

        document
          .getElementById("status")
          .className = "error";

        document
          .getElementById("status")
          .innerText =
            "❌ " +
            error.message;

      }

    };


  image.src =
    URL.createObjectURL(file);

}


/*************************************************
 * SEND CODE BACK
 *************************************************/

function sendCodeToRequest(code) {

  /*
   * ส่งกลับไปหน้าใบเบิก
   *
   * ถ้าเปิด Scanner จากระบบใบเบิก
   * จะส่งผ่าน localStorage
   */

  try {

    localStorage.setItem(
      "scannedItemCode",
      code
    );

  }

  catch(error) {

    console.log(error);

  }

}


/*************************************************
 * BACK TO REQUEST
 *************************************************/

function backToRequest() {

  const code =
    document
      .getElementById("resultCode")
      .innerText
      .trim();


  if (!code) {

    return;

  }


  /*
   * กลับหน้า Apps Script
   */

  window.location.href =
    REQUEST_URL +
    "?itemCode=" +
    encodeURIComponent(code);

}

</script>

</body>

</html>

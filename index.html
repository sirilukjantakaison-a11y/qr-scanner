<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<title>QR Scanner</title>

<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
}

.container {
  max-width: 600px;
  margin: auto;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h2 {
  text-align: center;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 8px;
  font-size: 17px;
}

.blue {
  background: #1a73e8;
  color: white;
}

.gray {
  background: #666;
  color: white;
}

.green {
  background: #188038;
  color: white;
}

.status {
  text-align: center;
  padding: 15px;
  margin-top: 10px;
  white-space: pre-line;
  font-weight: bold;
}

#reader {
  width: 100%;
  margin-top: 15px;
}

.result {
  margin-top: 15px;
  padding: 15px;
  background: #f8f9fa;
  border-radius: 10px;
  word-break: break-all;
}

.code {
  font-size: 22px;
  font-weight: bold;
  text-align: center;
  margin-top: 10px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>📷 QR Scanner</h2>

<button
  class="blue"
  onclick="startScanner()">
📷 เปิดกล้องและสแกน QR
</button>

<button
  class="gray"
  onclick="stopScanner()">
⏹ หยุดกล้อง
</button>

<div id="reader"></div>

<div id="status" class="status">
พร้อมใช้งาน
</div>

<div id="result" class="result">

<b>ข้อมูลจาก QR</b>

<div
  id="decodedText"
  class="code">
ยังไม่มีข้อมูล
</div>

</div>

</div>

</div>


<script>

let scanner = null;

let scanning = false;

let lastResult = "";


/* =========================================
   STATUS
========================================= */

function setStatus(message) {

  document.getElementById(
    "status"
  ).innerText = message;

}


/* =========================================
   START
========================================= */

async function startScanner() {

  if (scanning) {

    setStatus(
      "📷 กล้องกำลังทำงานอยู่"
    );

    return;

  }


  setStatus(
    "⏳ กำลังตรวจสอบกล้อง..."
  );


  try {

    /* HTTPS */

    if (!window.isSecureContext) {

      throw new Error(
        "หน้าเว็บไม่ใช่ HTTPS"
      );

    }


    /* Browser camera */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser ไม่รองรับกล้อง"
      );

    }


    /* ขอ permission */

    setStatus(
      "📷 กำลังขอสิทธิ์ใช้กล้อง..."
    );


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: true

      });


    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });


    /* อ่านกล้อง */

    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "ไม่พบกล้อง"
      );

    }


    /* เลือกกล้อง */

    let cameraId =
      cameras[0].id;


    const backCamera =
      cameras.find(function(camera) {

        const label =
          String(
            camera.label || ""
          ).toLowerCase();


        return (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        );

      });


    if (backCamera) {

      cameraId =
        backCamera.id;

    }


    /* Scanner */

    scanner =
      new Html5Qrcode(
        "reader"
      );


    scanning = true;


    setStatus(
      "⏳ กำลังเปิดกล้อง..."
    );


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );


          return {

            width: size,

            height: size

          };

        },

        aspectRatio: 1.0,

        disableFlip: false

      },


      function(decodedText) {

        handleQR(decodedText);

      },


      function() {}

    );


    setStatus(
      "✅ กล้องพร้อม\n" +
      "กรุณาหันกล้องไปที่ QR"
    );

  }


  catch(error) {

    console.error(
      error
    );


    scanning = false;


    if (scanner) {

      try {

        await scanner.clear();

      }

      catch(e) {}

    }


    scanner = null;


    let message =
      "❌ ไม่สามารถเปิดกล้องได้";


    if (error.name) {

      message +=
        "\nError: " +
        error.name;

    }


    if (error.message) {

      message +=
        "\n" +
        error.message;

    }


    setStatus(
      message
    );

  }

}


/* =========================================
   QR RESULT
========================================= */

async function handleQR(decodedText) {

  const code =
    String(
      decodedText || ""
    ).trim();


  if (!code) {
    return;
  }


  if (code === lastResult) {
    return;
  }


  lastResult =
    code;


  await stopScanner(
    false
  );


  document.getElementById(
    "decodedText"
  ).innerText =
    code;


  setStatus(
    "✅ สแกนสำเร็จ\n" +
    "QR: " +
    code
  );


  /*
   * ส่งค่ากลับไปยังระบบใบเบิก
   */

  sendResultToParent(
    code
  );

}


/* =========================================
   SEND RESULT
========================================= */

function sendResultToParent(code) {

  /*
   * กรณีเปิด Scanner เป็นหน้าต่างใหม่
   */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {

        type:
          "QR_RESULT",

        code:
          code

      },

      "*"

    );

  }


  /*
   * กรณีเปิด Scanner ใน iframe
   */

  if (
    window.parent &&
    window.parent !== window
  ) {

    window.parent.postMessage(

      {

        type:
          "QR_RESULT",

        code:
          code

      },

      "*"

    );

  }

}


/* =========================================
   STOP
========================================= */

async function stopScanner(
  showStatus = true
) {

  if (!scanner) {

    scanning = false;

    return;

  }


  try {

    if (scanning) {

      await scanner.stop();

    }

  }

  catch(error) {

    console.log(
      error
    );

  }


  try {

    await scanner.clear();

  }

  catch(error) {

    console.log(
      error
    );

  }


  scanner = null;

  scanning = false;


  if (showStatus) {

    setStatus(
      "⏹ หยุดกล้องแล้ว"
    );

  }

}

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ระบบใบเบิกวัสดุ</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 15px;
}

.container {
  max-width: 700px;
  margin: auto;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 15px;
}

h2,
h3 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 10px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

.start-btn {
  background: #1a73e8;
  color: white;
}

.stop-btn {
  background: #777;
  color: white;
}

.search-btn {
  background: #607d8b;
  color: white;
}

.add-btn {
  background: #ff9800;
  color: white;
}

.save-btn {
  background: #188038;
  color: white;
  font-weight: bold;
  font-size: 17px;
}

.delete-btn {
  background: #d93025;
  color: white;
  width: auto;
  padding: 7px 10px;
  margin: 0;
}

#reader {
  width: 100%;
  margin-top: 15px;
}

.status {
  margin-top: 12px;
  padding: 12px;
  border-radius: 8px;
  background: #eeeeee;
  text-align: center;
  font-weight: bold;
  white-space: pre-line;
}

.item-info {
  background: #f1f8e9;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  line-height: 1.7;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th,
td {
  border: 1px solid #ddd;
  padding: 8px;
  text-align: center;
}

th {
  background: #eeeeee;
}

.qty {
  width: 70px;
  padding: 7px;
}

.empty {
  color: #888;
  padding: 20px;
}

</style>

</head>


<body>

<div class="container">


<!-- ==========================
     HEADER
========================== -->

<div class="card">

<h2>📦 ระบบใบเบิกวัสดุ</h2>

<p>
ใบเบิกวัสดุหลายรายการ
</p>

</div>


<!-- ==========================
     ข้อมูลผู้เบิก
========================== -->

<div class="card">

<h3>👤 ข้อมูลผู้เบิก</h3>


<label>Employee</label>

<input
  id="employee"
  placeholder="ชื่อ-นามสกุล"
>


<label>Emp. ID</label>

<input
  id="empId"
  placeholder="รหัสพนักงาน"
>


<label>Department</label>

<input
  id="department"
  placeholder="หน่วยงาน"
>


<label>Station</label>

<input
  id="station"
  placeholder="Station"
>


<label>Model</label>

<input
  id="model"
  placeholder="Model"
>


<label>Used for</label>

<input
  id="usedFor"
  placeholder="ใช้สำหรับ"
>

</div>


<!-- ==========================
     QR SCANNER
========================== -->

<div class="card">

<h3>📷 สแกนวัสดุ</h3>


<button
  class="start-btn"
  onclick="startScanner()">

📷 สแกน QR Code

</button>


<button
  class="stop-btn"
  onclick="stopScanner()">

หยุดสแกน

</button>


<div id="reader"></div>


<div
  id="scanStatus"
  class="status">

พร้อมสแกน

</div>


<label>Item Code</label>

<input
  id="itemCode"
  placeholder="สแกน QR หรือกรอก Item Code"
>


<button
  class="search-btn"
  onclick="searchItem()">

🔍 ค้นหา Item

</button>


<div id="itemInfo"></div>


<label>จำนวน</label>

<input
  id="qty"
  type="number"
  min="1"
  value="1"
  placeholder="จำนวน"
>


<button
  class="add-btn"
  onclick="addItem()">

➕ เพิ่มรายการ

</button>

</div>


<!-- ==========================
     รายการ
========================== -->

<div class="card">

<h3>📋 รายการที่ต้องการเบิก</h3>


<table>

<thead>

<tr>

<th>#</th>

<th>Item Code</th>

<th>Item Name</th>

<th>Unit</th>

<th>Qty</th>

<th></th>

</tr>

</thead>


<tbody id="itemTable">

<tr>

<td
  colspan="6"
  class="empty">

ยังไม่มีรายการ

</td>

</tr>

</tbody>

</table>

</div>


<!-- ==========================
     SAVE
========================== -->

<div class="card">

<button
  class="save-btn"
  onclick="saveRequest()">

✅ ยืนยันการเบิก

</button>

</div>


</div>


<script>

/*************************************************
 * Apps Script URL
 *************************************************/

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzLMhxd0mP5Z4MR9fU09RMpQPT-y3pFDn3befo235Q9V0tZybIQkD9-_xeRXOfrPqJ2/exec";


/*************************************************
 * ตัวแปร
 *************************************************/

let scanner = null;

let selectedItem = null;

let items = [];


/*************************************************
 * แสดงสถานะ
 *************************************************/

function setStatus(message) {

  document
    .getElementById("scanStatus")
    .innerText = message;

}


/*************************************************
 * เปิด Scanner
 *************************************************/

function startScanner() {

  if (scanner) {

    setStatus(
      "📷 กล้องกำลังทำงาน"
    );

    return;

  }


  setStatus(
    "🔄 กำลังเปิดกล้อง..."
  );


  scanner =
    new Html5Qrcode("reader");


  Html5Qrcode.getCameras()

    .then(function(cameras) {


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "ไม่พบกล้อง"
        );

      }


      let cameraId =
        cameras[0].id;


      /*
       * พยายามเลือกกล้องหลัง
       */

      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          String(
            cameras[i].label || ""
          ).toLowerCase();


        if (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        ) {

          cameraId =
            cameras[i].id;

          break;

        }

      }


      return scanner.start(

        cameraId,

        {

          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },


        function(decodedText) {

          const code =
            String(
              decodedText || ""
            ).trim();


          /*
           * หยุดกล้อง
           */

          stopScanner();


          /*
           * ใส่ Item Code
           */

          document
            .getElementById("itemCode")
            .value = code;


          setStatus(
            "✅ สแกนสำเร็จ\n" +
            code +
            "\n\n" +
            "🔍 กำลังค้นหา Item..."
          );


          /*
           * ค้นหา Item อัตโนมัติ
           */

          searchItem();

        },


        function() {

          /*
           * ไม่แสดง error
           * ระหว่างที่ยังหา QR
           */

        }

      );

    })


    .catch(function(error) {

      console.error(
        "Camera Error:",
        error
      );


      scanner = null;


      setStatus(
        "❌ ไม่สามารถเปิดกล้องได้"
      );


      alert(
        "ไม่สามารถเปิดกล้องได้\n\n" +
        "กรุณาตรวจสอบสิทธิ์กล้องของ Chrome"
      );

    });

}


/*************************************************
 * หยุด Scanner
 *************************************************/

function stopScanner() {

  if (!scanner) {

    return;

  }


  scanner
    .stop()

    .then(function() {

      scanner.clear();

      scanner = null;

    })

    .catch(function() {

      scanner = null;

    });

}


/*************************************************
 * ค้นหา Item
 *************************************************/

function searchItem() {

  const code =
    document
      .getElementById("itemCode")
      .value
      .trim();


  if (!code) {

    alert(
      "กรุณาสแกน QR หรือกรอก Item Code"
    );

    return;

  }


  selectedItem = null;


  document
    .getElementById("itemInfo")
    .innerHTML = "";


  setStatus(
    "🔍 กำลังค้นหา Item..."
  );


  jsonp(

    "item",

    {
      itemCode: code
    },

    function(result) {


      if (
        !result ||
        !result.success
      ) {

        setStatus(
          "❌ " +
          (
            result &&
            result.message
              ? result.message
              : "ไม่สามารถเชื่อมต่อ Apps Script ได้"
          )
        );

        return;

      }


      /*
       * เก็บ Item
       */

      selectedItem = {

        itemCode:
          result.item.itemCode,

        itemName:
          result.item.itemName,

        description:
          result.item.description,

        unit:
          result.item.unit,

        location:
          result.item.location

      };


      /*
       * แสดงรายละเอียด
       */

      document
        .getElementById("itemInfo")
        .innerHTML =

        "<div class='item-info'>" +

        "<b>Item Code:</b> " +
        escapeHtml(
          selectedItem.itemCode
        ) +

        "<br>" +

        "<b>Item Name:</b> " +
        escapeHtml(
          selectedItem.itemName
        ) +

        "<br>" +

        "<b>Description:</b> " +
        escapeHtml(
          selectedItem.description
        ) +

        "<br>" +

        "<b>Unit:</b> " +
        escapeHtml(
          selectedItem.unit
        ) +

        "<br>" +

        "<b>Location:</b> " +
        escapeHtml(
          selectedItem.location
        ) +

        "</div>";


      setStatus(
        "✅ พบ Item"
      );

    }

  );

}


/*************************************************
 * เพิ่ม Item
 *************************************************/

function addItem() {

  if (!selectedItem) {

    alert(
      "กรุณาสแกนหรือค้นหา Item ก่อน"
    );

    return;

  }


  const qty =
    Number(
      document
        .getElementById("qty")
        .value
    );


  if (
    !qty ||
    qty <= 0
  ) {

    alert(
      "กรุณาระบุจำนวน"
    );

    return;

  }


  /*
   * ถ้ามี Item เดิม
   * ให้รวมจำนวน
   */

  const existing =
    items.find(
      function(item) {

        return (
          item.itemCode ===
          selectedItem.itemCode
        );

      }
    );


  if (existing) {

    existing.qty += qty;

  }

  else {

    items.push({

      itemCode:
        selectedItem.itemCode,

      itemName:
        selectedItem.itemName,

      unit:
        selectedItem.unit,

      qty:
        qty

    });

  }


  renderItems();


  /*
   * เตรียมสแกนรายการถัดไป
   */

  document
    .getElementById("itemCode")
    .value = "";


  document
    .getElementById("qty")
    .value = "1";


  document
    .getElementById("itemInfo")
    .innerHTML = "";


  selectedItem = null;


  setStatus(
    "✅ เพิ่มรายการแล้ว\n\n" +
    "พร้อมสแกนรายการถัดไป"
  );

}


/*************************************************
 * แสดงรายการ
 *************************************************/

function renderItems() {

  const table =
    document
      .getElementById("itemTable");


  table.innerHTML = "";


  if (
    items.length === 0
  ) {

    table.innerHTML =

      "<tr>" +

      "<td " +
      "colspan='6' " +
      "class='empty'>" +

      "ยังไม่มีรายการ" +

      "</td>" +

      "</tr>";

    return;

  }


  items.forEach(
    function(item, index) {


      const tr =
        document.createElement("tr");


      tr.innerHTML =

        "<td>" +
        (index + 1) +
        "</td>" +


        "<td>" +

        escapeHtml(
          item.itemCode
        ) +

        "</td>" +


        "<td>" +

        escapeHtml(
          item.itemName
        ) +

        "</td>" +


        "<td>" +

        escapeHtml(
          item.unit
        ) +

        "</td>" +


        "<td>" +

        "<input " +

        "class='qty' " +

        "type='number' " +

        "min='1' " +

        "value='" +
        item.qty +
        "' " +

        "onchange='changeQty(" +
        index +
        ", this.value)'>" +

        "</td>" +


        "<td>" +

        "<button " +

        "class='delete-btn' " +

        "onclick='deleteItem(" +
        index +
        ")'>" +

        "ลบ" +

        "</button>" +

        "</td>";


      table.appendChild(tr);

    }
  );

}


/*************************************************
 * เปลี่ยน Qty
 *************************************************/

function changeQty(
  index,
  value
) {

  const qty =
    Number(value);


  if (
    !qty ||
    qty <= 0
  ) {

    items[index].qty = 1;

  }

  else {

    items[index].qty = qty;

  }


  renderItems();

}


/*************************************************
 * ลบ Item
 *************************************************/

function deleteItem(index) {

  items.splice(
    index,
    1
  );


  renderItems();

}


/*************************************************
 * บันทึกใบเบิก
 *************************************************/

function saveRequest() {

  const employee =
    document
      .getElementById("employee")
      .value
      .trim();


  const empId =
    document
      .getElementById("empId")
      .value
      .trim();


  const department =
    document
      .getElementById("department")
      .value
      .trim();


  const station =
    document
      .getElementById("station")
      .value
      .trim();


  const model =
    document
      .getElementById("model")
      .value
      .trim();


  const usedFor =
    document
      .getElementById("usedFor")
      .value
      .trim();


  if (!employee) {

    alert(
      "กรุณากรอก Employee"
    );

    return;

  }


  if (!empId) {

    alert(
      "กรุณากรอก Emp. ID"
    );

    return;

  }


  if (!department) {

    alert(
      "กรุณากรอก Department"
    );

    return;

  }


  if (items.length === 0) {

    alert(
      "กรุณาสแกน Item อย่างน้อย 1 รายการ"
    );

    return;

  }


  const data = {

    employee:
      employee,

    empId:
      empId,

    department:
      department,

    station:
      station,

    model:
      model,

    usedFor:
      usedFor,

    items:
      items

  };


  setStatus(
    "⏳ กำลังบันทึกใบเบิก..."
  );


  jsonp(

    "save",

    {
      data:
        JSON.stringify(data)
    },

    function(result) {


      if (
        !result ||
        !result.success
      ) {

        setStatus(
          "❌ " +
          (
            result &&
            result.message
              ? result.message
              : "บันทึกไม่สำเร็จ"
          )
        );

        return;

      }


      alert(

        "✅ บันทึกใบเบิกสำเร็จ\n\n" +

        "Request No.: " +
        result.requestNo +

        "\n\n" +

        "จำนวนรายการ: " +
        result.itemCount +

        "\n" +

        "จำนวนรวม: " +
        result.totalQty

      );


      /*
       * เริ่มใบเบิกใหม่
       */

      items = [];

      selectedItem = null;

      renderItems();


      document
        .getElementById("employee")
        .value = "";


      document
        .getElementById("empId")
        .value = "";


      document
        .getElementById("department")
        .value = "";


      document
        .getElementById("station")
        .value = "";


      document
        .getElementById("model")
        .value = "";


      document
        .getElementById("usedFor")
        .value = "";


      document
        .getElementById("itemCode")
        .value = "";


      document
        .getElementById("qty")
        .value = "1";


      document
        .getElementById("itemInfo")
        .innerHTML = "";


      setStatus(
        "✅ พร้อมสำหรับใบเบิกใหม่"
      );

    }

  );

}


/*************************************************
 * JSONP
 *
 * ใช้เชื่อม GitHub Pages
 * กับ Google Apps Script
 *************************************************/

function jsonp(
  action,
  params,
  callback
) {


  const callbackName =

    "jsonp_" +

    Date.now() +

    "_" +

    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      "script"
    );


  let finished = false;


  function cleanup() {

    if (finished) {

      return;

    }


    finished = true;


    delete window[
      callbackName
    ];


    script.remove();

  }


  window[
    callbackName
  ] = function(data) {

    try {

      callback(data);

    }

    finally {

      cleanup();

    }

  };


  let url =

    SCRIPT_URL +

    "?action=" +

    encodeURIComponent(
      action
    );


  Object.keys(params)
    .forEach(
      function(key) {

        url +=

          "&" +

          encodeURIComponent(
            key
          ) +

          "=" +

          encodeURIComponent(
            params[key]
          );

      }
    );


  url +=

    "&callback=" +

    encodeURIComponent(
      callbackName
    );


  script.src = url;


  script.onerror =
    function() {

      cleanup();


      setStatus(
        "❌ เชื่อมต่อ Apps Script ไม่สำเร็จ"
      );

    };


  document
    .body
    .appendChild(script);

}


/*************************************************
 * ป้องกัน HTML Injection
 *************************************************/

function escapeHtml(text) {

  return String(
    text || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>QR Scanner - เบิกวัสดุ</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h2 {
      margin: 10px 0 15px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
    }

    #result {
      width: 100%;
      max-width: 450px;
      margin: 15px auto;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      white-space: pre-line;
      word-break: break-word;
    }

    button {
      font-size: 17px;
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #startBtn {
      background: #1a73e8;
      color: white;
    }

    #stopBtn {
      background: #777;
      color: white;
    }

    #startBtn:disabled {
      background: #aaa;
    }

  </style>

</head>


<body>

  <h2>📦 สแกน QR วัสดุ</h2>

  <div id="reader"></div>

  <div id="result">
    พร้อมสแกน
  </div>

  <button
    id="startBtn"
    onclick="startScanner()"
  >
    📷 เริ่มสแกน
  </button>

  <button
    id="stopBtn"
    onclick="stopScanner()"
  >
    หยุดสแกน
  </button>


<script>

/* ==================================================
   Google Apps Script Web App
   ================================================== */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwOiLFnz_7z0F1USR4qcV3_oBmcd2VRHJJ5B5xVP2qBWAznWv62QC14tbql1FIZuRS9bA/exec";


let scanner = null;
let isScanning = false;
let isSending = false;


/* ==================================================
   แสดงข้อความ
   ================================================== */

function showResult(message) {

  document.getElementById("result").innerText =
    message;

}


/* ==================================================
   เริ่ม Scanner
   ================================================== */

function startScanner() {

  if (isScanning) {
    return;
  }

  if (isSending) {
    return;
  }

  showResult("📷 กำลังเปิดกล้อง...");

  document.getElementById("startBtn").disabled = true;

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      if (isSending) {
        return;
      }

      isSending = true;

      isScanning = false;

      /*
       * หยุดกล้อง
       */

      stopScanner();


      /*
       * แสดงข้อมูล
       */

      showResult(
        "📦 Item Code: " +
        decodedText +
        "\n\nกำลังบันทึก..."
      );


      /*
       * ส่งข้อมูล
       */

      sendItemCode(decodedText);

    },

    function(errorMessage) {

      /*
       * ไม่ต้องแสดง error
       * ระหว่างค้นหา QR
       */

    }

  )

  .then(function() {

    isScanning = true;

    document.getElementById("startBtn").disabled = false;

    showResult("📷 พร้อมสแกน QR");

  })

  .catch(function(error) {

    isScanning = false;

    document.getElementById("startBtn").disabled = false;

    showResult(
      "❌ ไม่สามารถเปิดกล้องได้\n\n" +
      error
    );

  });

}


/* ==================================================
   หยุด Scanner
   ================================================== */

function stopScanner() {

  if (!scanner) {

    isScanning = false;

    document.getElementById("startBtn").disabled = false;

    return;

  }


  scanner
    .stop()

    .then(function() {

      scanner.clear();

      scanner = null;

      isScanning = false;

      document.getElementById("startBtn").disabled = false;

    })

    .catch(function() {

      scanner = null;

      isScanning = false;

      document.getElementById("startBtn").disabled = false;

    });

}


/* ==================================================
   ส่ง Item Code ไป Google Apps Script
   JSONP
   ================================================== */

function sendItemCode(itemCode) {

  itemCode =
    String(itemCode || "").trim();


  if (!itemCode) {

    isSending = false;

    showResult(
      "❌ ไม่พบ Item Code"
    );

    return;

  }


  /*
   * สร้างชื่อ Callback
   */

  const callbackName =
    "qrCallback_" +
    Date.now();


  /*
   * สร้าง Script
   */

  const script =
    document.createElement("script");


  /*
   * ตั้งเวลา Timeout
   */

  const timeout =
    setTimeout(function() {

      if (window[callbackName]) {

        delete window[callbackName];

      }

      script.remove();

      isSending = false;

      showResult(
        "❌ Google Apps Script ไม่ตอบกลับ\n\n" +
        "กรุณาตรวจสอบ Internet แล้วลองใหม่"
      );

    }, 15000);


  /*
   * Callback
   */

  window[callbackName] =
    function(data) {

      clearTimeout(timeout);


      try {

        if (data && data.success) {

          showResult(
            "✅ บันทึกสำเร็จ\n\n" +
            data.message
          );

        }

        else {

          showResult(
            "❌ บันทึกไม่สำเร็จ\n\n" +
            (
              data && data.message
                ? data.message
                : "ไม่ทราบสาเหตุ"
            )
          );

        }

      }

      catch(error) {

        showResult(
          "❌ เกิดข้อผิดพลาด\n\n" +
          error
        );

      }


      /*
       * ล้าง Callback
       */

      delete window[callbackName];

      script.remove();

      isSending = false;

    };


  /*
   * สร้าง URL
   */

  const requestUrl =
    SCRIPT_URL +
    "?action=scan" +
    "&itemCode=" +
    encodeURIComponent(itemCode) +
    "&callback=" +
    callbackName;


  /*
   * กำหนด URL
   */

  script.src =
    requestUrl;


  /*
   * ถ้าโหลดไม่ได้
   */

  script.onerror =
    function() {

      clearTimeout(timeout);

      delete window[callbackName];

      script.remove();

      isSending = false;

      showResult(
        "❌ เชื่อมต่อ Google Sheet ไม่สำเร็จ\n\n" +
        "กรุณาลองใหม่อีกครั้ง"
      );

    };


  /*
   * ส่ง Request
   */

  document.body.appendChild(script);

}


/* ==================================================
   ป้องกันกดปุ่ม Stop แล้วเกิด Error
   ================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    if (scanner) {

      scanner
        .stop()
        .catch(function() {});

    }

  }
);

</script>

</body>

</html>

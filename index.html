```html
<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>ใบเบิกวัสดุ QR</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 15px;
}

.container {
  max-width: 500px;
  margin: auto;
}

h2 {
  text-align: center;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}

label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 11px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: 0;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
}

#startBtn {
  background: #1a73e8;
  color: white;
}

#stopBtn {
  background: #777;
  color: white;
}

#saveBtn {
  background: #188038;
  color: white;
  font-weight: bold;
}

#reader {
  margin-top: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th,
td {
  border-bottom: 1px solid #ddd;
  padding: 8px;
  text-align: left;
}

.qty {
  width: 70px;
  padding: 7px;
}

.delete {
  background: #d93025;
  color: white;
  padding: 7px;
  margin: 0;
  width: auto;
}

#result {
  text-align: center;
  padding: 10px;
  font-weight: bold;
}

</style>

</head>


<body>

<div class="container">

<h2>📦 ใบเบิกวัสดุ</h2>


<!-- ข้อมูลผู้เบิก -->

<div class="card">

<h3>ข้อมูลผู้เบิก</h3>

<label>Employee</label>

<input
  id="employee"
  placeholder="ชื่อผู้เบิก"
>


<label>Emp. ID</label>

<input
  id="empId"
  placeholder="รหัสพนักงาน"
>


<label>Station</label>

<input
  id="station"
  placeholder="Station"
>


<label>Model</label>

<input
  id="model"
  placeholder="Model"
>


<label>Used for</label>

<input
  id="usedFor"
  placeholder="ใช้สำหรับ"
>

</div>


<!-- Scanner -->

<div class="card">

<h3>📷 รายการวัสดุ</h3>

<button
  id="startBtn"
  onclick="startScanner()"
>
📷 เริ่มสแกน Item
</button>

<button
  id="stopBtn"
  onclick="stopScanner()"
>
หยุดสแกน
</button>

<div id="reader"></div>

<div id="result">
พร้อมสแกน
</div>

</div>


<!-- รายการ -->

<div class="card">

<h3>รายการเบิก</h3>

<table>

<thead>

<tr>

<th>Item</th>

<th>Qty</th>

<th></th>

</tr>

</thead>

<tbody id="itemTable">

</tbody>

</table>

</div>


<!-- บันทึก -->

<div class="card">

<button
  id="saveBtn"
  onclick="saveIssue()"
>
🟢 บันทึกใบเบิก
</button>

</div>


</div>


<script>


/*************************************************
 * Google Apps Script URL
 *************************************************/

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwOiLFnz_7z0F1USR4qcV3_oBmcd2VRHJJ5B5xVP2qBWAznWv62QC14tbql1FIZuRS9bA/exec";


let scanner = null;

let items = [];


/*************************************************
 * เริ่ม Scanner
 *************************************************/

function startScanner() {

  document.getElementById("result")
    .innerText =
    "กำลังเปิดกล้อง...";


  if (scanner) {

    return;

  }


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      stopScanner();

      const itemCode =
        decodedText.trim();


      document.getElementById("result")
        .innerText =
        "กำลังค้นหา Item...";


      findItem(itemCode);

    },

    function() {

      // ไม่แสดง error ระหว่างค้นหา QR

    }

  )

  .catch(function(error) {

    document.getElementById("result")
      .innerText =
      "❌ ไม่สามารถเปิดกล้องได้";

  });

}


/*************************************************
 * หยุด Scanner
 *************************************************/

function stopScanner() {

  if (!scanner) {

    return;

  }


  scanner
    .stop()
    .then(function() {

      scanner.clear();

      scanner = null;

    })
    .catch(function() {

      scanner = null;

    });

}


/*************************************************
 * เรียกค้นหา Item
 *************************************************/

function findItem(itemCode) {

  jsonp(

    "item",

    {
      itemCode: itemCode
    },

    function(data) {

      if (!data.success) {

        document.getElementById("result")
          .innerText =
          "❌ " + data.message;

        return;

      }


      addItem(
        data.itemCode,
        data.itemName
      );

    }

  );

}


/*************************************************
 * เพิ่ม Item
 *************************************************/

function addItem(
  itemCode,
  itemName
) {

  const existing =
    items.find(function(item) {

      return item.itemCode === itemCode;

    });


  if (existing) {

    existing.qty++;

  }

  else {

    items.push({

      itemCode: itemCode,

      itemName: itemName,

      qty: 1

    });

  }


  renderItems();


  document.getElementById("result")
    .innerText =
    "✅ เพิ่ม " +
    itemCode;

}


/*************************************************
 * แสดงรายการ
 *************************************************/

function renderItems() {

  const table =
    document.getElementById("itemTable");


  table.innerHTML = "";


  items.forEach(function(item, index) {

    const tr =
      document.createElement("tr");


    tr.innerHTML = `

      <td>
        <b>${escapeHtml(item.itemCode)}</b>
        <br>
        ${escapeHtml(item.itemName)}
      </td>

      <td>

        <input
          class="qty"
          type="number"
          min="1"
          value="${item.qty}"
          onchange="changeQty(${index}, this.value)"
        >

      </td>

      <td>

        <button
          class="delete"
          onclick="deleteItem(${index})"
        >
          ลบ
        </button>

      </td>

    `;


    table.appendChild(tr);

  });

}


/*************************************************
 * เปลี่ยน Qty
 *************************************************/

function changeQty(index, value) {

  const qty =
    Number(value);


  if (qty <= 0) {

    items[index].qty = 1;

  }

  else {

    items[index].qty = qty;

  }


  renderItems();

}


/*************************************************
 * ลบ Item
 *************************************************/

function deleteItem(index) {

  items.splice(index, 1);

  renderItems();

}


/*************************************************
 * บันทึกใบเบิก
 *************************************************/

function saveIssue() {

  const employee =
    document.getElementById("employee")
      .value.trim();

  const empId =
    document.getElementById("empId")
      .value.trim();

  const station =
    document.getElementById("station")
      .value.trim();

  const model =
    document.getElementById("model")
      .value.trim();

  const usedFor =
    document.getElementById("usedFor")
      .value.trim();


  if (!employee) {

    alert("กรุณากรอก Employee");

    return;

  }


  if (!empId) {

    alert("กรุณากรอก Emp. ID");

    return;

  }


  if (!station) {

    alert("กรุณากรอก Station");

    return;

  }


  if (!model) {

    alert("กรุณากรอก Model");

    return;

  }


  if (!usedFor) {

    alert("กรุณากรอก Used for");

    return;

  }


  if (items.length === 0) {

    alert(
      "กรุณาสแกน Item อย่างน้อย 1 รายการ"
    );

    return;

  }


  const data = {

    employee: employee,

    empId: empId,

    station: station,

    model: model,

    usedFor: usedFor,

    items: items

  };


  document.getElementById("result")
    .innerText =
    "⏳ กำลังบันทึกใบเบิก...";


  jsonp(

    "save",

    {
      data: JSON.stringify(data)
    },

    function(result) {

      if (!result.success) {

        document.getElementById("result")
          .innerText =
          "❌ " + result.message;

        return;

      }


      document.getElementById("result")
        .innerText =
        "✅ บันทึกใบเบิกสำเร็จ\n" +
        "Request No.: " +
        result.requestNo +
        "\n" +
        "จำนวน " +
        result.itemCount +
        " Item / " +
        result.totalQty +
        " หน่วย";


      alert(
        "บันทึกใบเบิกสำเร็จ\n\n" +
        "Request No.: " +
        result.requestNo +
        "\nรายการ: " +
        result.itemCount +
        " Item\n" +
        "จำนวนรวม: " +
        result.totalQty
      );


      // เริ่มใบเบิกใหม่

      items = [];

      renderItems();

      document.getElementById("employee").value = "";
      document.getElementById("empId").value = "";
      document.getElementById("station").value = "";
      document.getElementById("model").value = "";
      document.getElementById("usedFor").value = "";

    }

  );

}


/*************************************************
 * JSONP
 *************************************************/

function jsonp(
  action,
  params,
  callback
) {

  const callbackName =
    "callback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 10000
    );


  const script =
    document.createElement("script");


  window[callbackName] =
    function(data) {

      try {

        callback(data);

      }

      finally {

        delete window[callbackName];

        script.remove();

      }

    };


  let url =
    SCRIPT_URL +
    "?action=" +
    encodeURIComponent(action);


  Object.keys(params).forEach(function(key) {

    url +=
      "&" +
      encodeURIComponent(key) +
      "=" +
      encodeURIComponent(params[key]);

  });


  url +=
    "&callback=" +
    encodeURIComponent(callbackName);


  script.src = url;


  script.onerror =
    function() {

      document.getElementById("result")
        .innerText =
        "❌ เชื่อมต่อ Google Apps Script ไม่สำเร็จ";

      delete window[callbackName];

      script.remove();

    };


  document.body.appendChild(script);

}


/*************************************************
 * ป้องกัน HTML injection
 *************************************************/

function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
```
